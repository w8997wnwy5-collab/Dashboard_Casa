name: Mercati

# Nei giorni feriali, ogni ora: cambio EUR/CHF e titolo Interroll in data/mercati.json.
# Il commit tiene anche "vivo" il repository, così GitHub non spegne le altre automazioni.
on:
  schedule:
    - cron: "23 6-17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercati
  cancel-in-progress: false

jobs:
  mercati:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Aggiorna i mercati
        working-directory: scripts
        run: python mercati.py
      - name: Salva
        run: |
          git config user.name "casa-bot"
          git config user.email "casa-bot@users.noreply.github.com"
          git add data/mercati.json
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Mercati aggiornati"
            git pull --rebase --autostash
            git push
          fi
